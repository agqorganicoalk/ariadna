<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12224A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ariadna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ariadna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: columna única de trabajo (máx. 600px), cabecera AGQ fija con progreso por tandas, barra de acciones fija abajo para el pulgar. */
:root{
  --agq-blue:#12224A; --agq-green:#639C4F;
  --hdr-bg:#12224A; --hdr-fg:#ffffff; --hdr-muted:#c3cbe0; --hdr-line:rgba(255,255,255,.3); --hdr-chip:rgba(255,255,255,.14); --hdr-strong:#ffffff; --hdr-ok:#8fcf7c;
  --bg:#f3f5f9; --surface:#ffffff; --sunken:#e8ecf3; --line:#d2d9e6;
  --fg:#14203a; --muted:#56617a;
  --brand:#12224A; --brand-ink:#ffffff; --brand-soft:#e2e8f3;
  --go:#3f7a33; --go-ink:#ffffff; --go-soft:#e4f0df; --go-text:#336b29;
  --warn:#8a5300; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f9dedb;
  --font-ui:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hdr-bg:#0f1c3d;--hdr-fg:#ffffff;--hdr-muted:#b9c3dc;
  --bg:#0b1222;--surface:#131c31;--sunken:#1b2640;--line:#2c3958;--fg:#e8edf6;--muted:#9ba7c2;
  --brand:#a9bbe8;--brand-ink:#0b1328;--brand-soft:#1b2a4d;
  --go:#7fbf6b;--go-ink:#0b1a07;--go-soft:#1b2e16;--go-text:#9ed68a;
  --warn:#e8b25a;--warn-soft:#3a2c12;--bad:#f2867d;--bad-soft:#40201d;--bad-ink:#2a0d0b;color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr-bg:#0f1c3d;--hdr-fg:#ffffff;--hdr-muted:#b9c3dc;
  --bg:#0b1222;--surface:#131c31;--sunken:#1b2640;--line:#2c3958;--fg:#e8edf6;--muted:#9ba7c2;
  --brand:#a9bbe8;--brand-ink:#0b1328;--brand-soft:#1b2a4d;
  --go:#7fbf6b;--go-ink:#0b1a07;--go-soft:#1b2e16;--go-text:#9ed68a;
  --warn:#e8b25a;--warn-soft:#3a2c12;--bad:#f2867d;--bad-soft:#40201d;--bad-ink:#2a0d0b;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:14px 150px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* Ensayos en paralelo: cada hueco tiene su color de cabecera y de acento para no mezclar PNT */
:root[data-slot="B"]{--hdr-muted:#e3efde;--hdr-bg:#2a6230;--brand:#3f7a33;--brand-soft:#e4f0df;--mark-thread:#d4f2c9}
:root[data-slot="D"]{--hdr-ok:#336b29;--hdr-bg:#cddbee;--hdr-fg:#12224A;--hdr-muted:#3e4d6b;--hdr-line:rgba(18,34,74,.24);--hdr-chip:rgba(18,34,74,.07);--hdr-strong:#12224A;--brand:#2b4a7e;--brand-ink:#ffffff;--brand-soft:#dde7f5}
:root[data-slot="E"]{--hdr-ok:#336b29;--hdr-bg:#e9e0cf;--hdr-fg:#2a2416;--hdr-muted:#5a5140;--hdr-line:rgba(18,34,74,.24);--hdr-chip:rgba(18,34,74,.07);--hdr-strong:#2a2416;--brand:#6b5a3a;--brand-ink:#ffffff;--brand-soft:#f1ebe0}
:root[data-slot="C"]{--hdr-ok:#336b29;--hdr-bg:#ffffff;--hdr-fg:#12224A;--hdr-muted:#56617a;--hdr-line:rgba(18,34,74,.22);--hdr-chip:rgba(18,34,74,.06);--hdr-strong:#12224A;--brand:#12224A;--brand-ink:#ffffff;--brand-soft:#e2e8f3}
@media (prefers-color-scheme: dark){
  :root[data-slot="B"]:not([data-theme="light"]){--hdr-muted:#e3efde;--hdr-bg:#24532a;--brand:#8fcf7c;--brand-soft:#1b2e16}
  :root[data-slot="D"]:not([data-theme="light"]){--hdr-ok:#336b29;--hdr-bg:#a8c0e4;--hdr-fg:#12224A;--hdr-muted:#34425f;--hdr-line:rgba(18,34,74,.26);--hdr-chip:rgba(18,34,74,.08);--hdr-strong:#12224A;--brand:#a9c3ec;--brand-ink:#0b1328;--brand-soft:#1b2a4d}
  :root[data-slot="E"]:not([data-theme="light"]){--hdr-ok:#336b29;--hdr-bg:#dcd1bc;--hdr-fg:#2a2416;--hdr-muted:#4f4736;--hdr-line:rgba(18,34,74,.26);--hdr-chip:rgba(18,34,74,.08);--hdr-strong:#2a2416;--brand:#d9c7a4;--brand-ink:#0b1328;--brand-soft:#2f2818}
  :root[data-slot="C"]:not([data-theme="light"]){--hdr-ok:#336b29;--hdr-bg:#f1f3f7;--hdr-fg:#12224A;--hdr-muted:#46516b;--hdr-line:rgba(18,34,74,.25);--hdr-chip:rgba(18,34,74,.07);--hdr-strong:#12224A;--brand:#d6deee;--brand-ink:#0b1328;--brand-soft:#22304f}}
:root[data-theme="dark"][data-slot="B"]{--hdr-muted:#e3efde;--hdr-bg:#24532a;--brand:#8fcf7c;--brand-soft:#1b2e16}
:root[data-theme="dark"][data-slot="D"]{--hdr-ok:#336b29;--hdr-bg:#a8c0e4;--hdr-fg:#12224A;--hdr-muted:#34425f;--hdr-line:rgba(18,34,74,.26);--hdr-chip:rgba(18,34,74,.08);--hdr-strong:#12224A;--brand:#a9c3ec;--brand-ink:#0b1328;--brand-soft:#1b2a4d}
:root[data-theme="dark"][data-slot="E"]{--hdr-ok:#336b29;--hdr-bg:#dcd1bc;--hdr-fg:#2a2416;--hdr-muted:#4f4736;--hdr-line:rgba(18,34,74,.26);--hdr-chip:rgba(18,34,74,.08);--hdr-strong:#2a2416;--brand:#d9c7a4;--brand-ink:#0b1328;--brand-soft:#2f2818}
:root[data-theme="dark"][data-slot="C"]{--hdr-ok:#336b29;--hdr-bg:#f1f3f7;--hdr-fg:#12224A;--hdr-muted:#46516b;--hdr-line:rgba(18,34,74,.25);--hdr-chip:rgba(18,34,74,.07);--hdr-strong:#12224A;--brand:#d6deee;--brand-ink:#0b1328;--brand-soft:#22304f}
.slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.top-in>*{min-width:0}
.slots .ot{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-data);font-weight:500;font-size:11.5px;opacity:.85}
.slots button{flex:none;min-height:34px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid var(--hdr-line);background:transparent;color:var(--hdr-fg);display:flex;align-items:center;gap:6px}
.slots button .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:1.5px solid var(--hdr-strong)}
.slots button .dot.c{color:#12224A;border-color:#12224A}
.slots button[aria-current="true"]{background:var(--hdr-strong);color:var(--hdr-bg);border-color:var(--hdr-strong)}
.slots button[aria-current="true"] .dot{border-color:transparent}
.slot-badge{width:30px;height:30px;border-radius:50%;background:var(--hdr-strong);color:var(--hdr-bg);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.switch-ov{position:fixed;inset:0;z-index:80;background:var(--hdr-bg);color:var(--hdr-fg);display:grid;place-content:center;text-align:center;gap:10px;padding:24px}
.switch-ov .ov-big{font-size:96px;font-weight:800;line-height:1}
.switch-ov .ov-pnt{font-size:22px;font-weight:700;color:var(--hdr-fg)}
.switch-ov .ov-sub{font-family:var(--font-data);font-size:14px;color:var(--hdr-muted)}
.sync{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--hdr-chip);color:var(--hdr-fg)}
.sync.ok::before{content:"● ";color:var(--hdr-ok)}
.sync.bad{background:#fbe9e7;color:#a3221b;box-shadow:inset 0 0 0 1px rgba(163,34,27,.25)}
.sync.bad::before{content:"▲ "}
/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg);color:var(--hdr-fg);border-bottom:3px solid var(--agq-green);box-shadow:0 2px 10px rgba(18,34,74,.12)}
:root[data-slot="C"] .wordmark,:root[data-slot="D"] .wordmark{color:var(--agq-blue)}:root[data-slot="E"] .wordmark{color:#2a2416}
.top-in{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0}
.brandbox img{height:28px;width:auto;display:block}
.brandbox .mark{width:38px;height:38px;flex:none;color:var(--hdr-fg)}
.brandbox .mark .t{stroke:var(--mark-thread,#8fcf7c)}.brandbox .mark .td{fill:var(--mark-thread,#8fcf7c)}
:root[data-slot="C"],:root[data-slot="D"],:root[data-slot="E"]{--mark-thread:#4f8a3d}
.brandtxt{display:grid;min-width:0;line-height:1.15}
.wordmark{font-weight:700;font-size:19px;letter-spacing:.03em;white-space:nowrap}
.app{font-size:11.5px;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.brandbox img{height:22px}
.reg-btn{min-height:36px;padding:0 12px;border-radius:8px;background:var(--hdr-chip);color:var(--hdr-fg);font-size:14px;font-weight:600;border:1px solid var(--hdr-line);display:flex;align-items:center;gap:6px;flex:none}
.reg-btn .n{font-family:var(--font-data);font-size:12px;background:var(--agq-green);color:#1b2600;border-radius:999px;padding:0 6px}
.meta-row{display:flex;gap:2px 14px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere;font-family:var(--font-data);font-size:11.5px;color:var(--hdr-muted)}
.meta-row b{color:var(--hdr-fg);font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;list-style:none;margin:0;padding:0}
.tabs li{min-width:0}
.tabs button{all:unset;display:grid;gap:4px;min-width:0;cursor:pointer}
.tabs button:disabled{cursor:default;opacity:1}
.tabs .bar{height:4px;border-radius:2px;background:var(--hdr-line)}
.tabs .done .bar{background:var(--agq-green)}
.tabs .cur .bar{background:var(--hdr-strong)}
.tabs .lbl{font-size:11px;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .cur .lbl{color:var(--hdr-strong);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--hdr-strong);outline-offset:2px;border-radius:3px}

h1{font-size:22px;line-height:1.25;margin:6px 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
.stack{display:grid;gap:14px}
.field{display:grid;gap:6px}
label.f,.f{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:13px}
select,input[type=text],input[type=email],textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:11px 12px;min-height:48px}
textarea{min-height:120px;resize:vertical}
input.big{font-size:21px;font-weight:600;padding-block:9px}
input.err{border-color:var(--bad)}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,.cam:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.unit{display:flex;align-items:center;gap:8px}
.unit input{flex:1;min-width:0}
.unit>span{font-family:var(--font-data);font-weight:600;color:var(--muted);min-width:34px}
.unit>span.useg{display:flex;gap:2px;background:var(--sunken);border-radius:9px;padding:3px;min-width:auto}
.useg button{min-height:38px;padding:0 9px;border-radius:7px;background:transparent;color:var(--muted);font-family:var(--font-data);font-size:14px}
.useg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.chip.reading,.chip.prog{background:var(--brand-soft);color:var(--brand)}
.chip.review{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--go-soft);color:var(--go-text)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* Selector segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunken);padding:4px;border-radius:12px}
.seg button{min-height:44px;border-radius:9px;background:transparent;color:var(--muted);font-size:14.5px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;background:var(--sunken);color:var(--fg);font-size:14px;font-weight:500;font-family:var(--font-data)}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.chips.ui button{font-family:var(--font-ui);font-size:14.5px}
.chips button:disabled{opacity:1;cursor:default}

/* PNT */
.pnt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.pnt input{margin-top:4px;width:20px;height:20px;accent-color:var(--brand);flex:none}
.pnt .code{font-family:var(--font-data);font-weight:600;font-size:14px}
.pnt .meta{font-size:13px;color:var(--muted)}
.pnt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.pnt:has(input:disabled){cursor:default}

/* Captura */
.cam{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;cursor:pointer;user-select:none}
.cam.secondary{background:transparent;color:var(--brand);border:1.5px solid var(--brand);min-height:42px;font-size:15px}
.cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cam svg{width:22px;height:22px;flex:none}
.shot{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.roi-wrap{text-align:center}.roi{position:relative;display:inline-block;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;cursor:crosshair}.roi img{display:block;max-width:100%;max-height:58vh;pointer-events:none}.roi-r{position:absolute;border:3px solid #639C4F;border-radius:4px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.shot img,.thumb{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunken);cursor:zoom-in}
.shot .meta{font-family:var(--font-data);font-size:11.5px;color:var(--muted);display:grid;gap:2px;min-width:0;word-break:break-all}
.ocr{display:flex;align-items:center;gap:10px;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.ocr .pct{margin-left:auto;font-family:var(--font-data);font-variant-numeric:tabular-nums}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ocrbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.ocrbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.notice{font-size:13.5px;border-radius:8px;padding:9px 11px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--sunken);color:var(--muted)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.linkbtns{display:flex;flex-wrap:wrap;gap:8px}
.linkbtns button{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px;background:var(--sunken);color:var(--brand);font-weight:600}
details.raw{font-size:13px;color:var(--muted)}
details.raw pre{font-family:var(--font-data);white-space:pre-wrap;word-break:break-all;background:var(--sunken);padding:8px;border-radius:6px;margin:6px 0 0;max-height:140px;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px;border-radius:var(--r);background:var(--sunken);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--go-text);flex:none;margin:0}
.check:has(input:checked){background:var(--go-soft);color:var(--go-text);font-weight:600}
.check:has(input:disabled){opacity:.55;cursor:not-allowed}

/* Resultado de cálculo */
.calc{border-radius:12px;background:var(--brand-soft);padding:12px 14px;display:grid;gap:4px}
.calc .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
.calc .v{font-family:var(--font-data);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);word-break:break-word}
.calc .f{font-family:var(--font-data);font-size:12.5px;color:var(--muted);font-weight:400}
.calc.empty .v{color:var(--muted);font-size:16px}

/* Preguntas */
.ask{background:var(--surface);border:1.5px solid var(--brand);border-radius:14px;padding:16px;display:grid;gap:12px}
.ask .q{font-size:18px;font-weight:700;text-wrap:balance}
.ask .btncol{display:grid;gap:8px}

/* Lista de la tanda */
.items{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.item .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .code{font-family:var(--font-data);font-weight:600;word-break:break-all}
.item .l2{font-size:13.5px;color:var(--muted)}
.item .res{font-family:var(--font-data);font-size:14px}
.empty-state{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);display:grid;gap:6px}

/* Registro */
.reg-t{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reg-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.reg-item>header{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:var(--sunken)}
.reg-ev{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.reg-ev .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.reg-ev .h b{font-size:14.5px}
.reg-ev .t{font-family:var(--font-data);font-size:11.5px;color:var(--muted)}
.reg-ev dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}
.reg-ev dt{color:var(--muted)}
.reg-ev dd{margin:0;font-family:var(--font-data);min-width:0;word-break:break-word}
.reg-ev.anulada{background:var(--bad-soft)}
.reg-ev.anulada dd,.reg-ev.anulada .h b{text-decoration:line-through;text-decoration-thickness:1px}
.reg-ev .motivo{font-size:13px;color:var(--bad);text-decoration:none}
.reg-ev.dil{padding-left:28px;position:relative}
.reg-ev.dil::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--line)}
.reg-acts{display:flex;flex-wrap:wrap;gap:6px}
.reg-acts button{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;text-decoration:none!important}
.tag.ok{background:var(--go-soft);color:var(--go-text)}
.tag.info{background:var(--sunken);color:var(--muted)}

/* Hoja modal */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(14,12,34,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet.full{height:92%}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:2}
.sheet-h h2{font-size:18px}
.x{min-height:40px;min-width:40px;border-radius:10px;background:var(--sunken);color:var(--fg);font-size:20px;padding:0}
.sheet img.big{width:100%;border-radius:10px}

/* Resumen */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tbl th,.tbl td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{border-top:0;background:var(--sunken);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.done-box{background:var(--go-soft);color:var(--go-text);border-radius:14px;padding:14px;display:grid;gap:10px}

/* Barra de acciones */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions-in{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;gap:6px}
.why{font-size:12.5px;color:var(--muted)}
.btns{display:flex;gap:10px}
.btns>button{flex:1}
.btns>button.back{flex:0 0 auto}
button{font:inherit;border:0;border-radius:var(--r);min-height:50px;padding:0 16px;font-weight:600;font-size:16px;cursor:pointer}
.b-pri{background:var(--brand);color:var(--brand-ink)}
.b-go{background:var(--go);color:var(--go-ink)}
.b-sec{background:var(--sunken);color:var(--fg)}
.b-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.b-bad{background:var(--bad);color:var(--bad-ink,#fff)}
.w100{width:100%}
button:disabled{cursor:not-allowed}
.b-pri:disabled,.b-go:disabled,.b-bad:disabled{background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.b-ghost:disabled,.b-sec:disabled,.seg button:disabled,.chips button:disabled:not([aria-pressed="true"]),.linkbtns button:disabled,.reg-acts button:disabled{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.ocrbar i{transition:none}}

const STORE = { db:null, ok:false };
function idbOpen(){

      rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos"); };
      rq.onsuccess = () => { STORE.db = rq.result; STORE.ok = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    } catch(_) { res(false); }

}
function idb(store, mode, fn){
  return new Promise((res, rej) => {
    if (!STORE.ok) return rej(new Error("sin almacenamiento"));
    try { const tx = STORE.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }
    catch(e){ rej(e); }
  });
}

/* ================= Guardado en la nube (base de datos privada de cada analista en el artifact) =================
   El navegador del móvil puede borrar sus datos (app cerrada, falta de espacio, otro visor). Por eso cada cambio
   se guarda también en la base de datos del artifact, en una zona privada de cada analista, y las fotos como recursos del artifact. */
const CLOUD = { db:null, uid:"", assets:null, ok:false, state:"init", lastOk:"", err:"", pending:{}, timer:null, chain:Promise.resolve(), sent:{} };
const CHUNK = 180000;
async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") { CLOUD.state = "off"; CLOUD.err = "este visor no ofrece guardado en la nube"; return; }
    const [db, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 12000, "sin respuesta");
    if (!db || !user) { CLOUD.state = "off"; CLOUD.err = "la base de datos no está disponible en este visor"; return; }
    const uid = await user.id();
    if (!uid) { CLOUD.state = "off"; CLOUD.err = "inicia sesión en Claude para guardar en la nube"; return; }
    CLOUD.db = db; CLOUD.uid = uid; CLOUD.ok = true; CLOUD.state = "ok";
    window.claude.use("assets").then(a => { CLOUD.assets = a; if (a) uploadPending(); }).catch(() => {});
  } catch (e) { CLOUD.state = "off"; CLOUD.err = (e && e.message) || "error"; }
  renderSync();
}
const cdoc = id => CLOUD.db.doc(`data/users/${CLOUD.uid}/${id}`);
async function withRetry(fn){ try { return await fn(); } catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random()*800)); return await fn(); } throw e; } }
function cloudSchedule(slot, json, idx){
  if (!CLOUD.ok) return;
  CLOUD.pending[slot] = json; CLOUD.pending.__index = idx;
  clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudFlush, 1500);
  CLOUD.state = "saving"; renderSync();
}
function cloudFlush(){
  clearTimeout(CLOUD.timer);
  const work = CLOUD.pending; CLOUD.pending = {};
  CLOUD.chain = CLOUD.chain.then(async () => {
    try {
      for (const [k, json] of Object.entries(work)) {
        if (k === "__index") continue;
        if (CLOUD.sent[k] === json) continue;
        const n = Math.max(1, Math.ceil(json.length / CHUNK));
        for (let i = 0; i < n; i++) await withRetry(() => cdoc(`slot-${k}-c${i}`).set({ s: json.slice(i*CHUNK, (i+1)*CHUNK) }));
        await withRetry(() => cdoc(`slot-${k}`).set({ chunks:n, len:json.length, savedAt: JSON.parse(json).savedAt || new Date().toISOString() }));
        CLOUD.sent[k] = json;
      }
      if (work.__index && CLOUD.sent.__index !== work.__index) { await withRetry(() => cdoc("index").set({ index: work.__index, savedAt: new Date().toISOString() })); CLOUD.sent.__index = work.__index; }
      CLOUD.state = "ok"; CLOUD.lastOk = isoLocal(); CLOUD.err = "";
    } catch (e) {
      CLOUD.state = "error"; CLOUD.err = (e && (e.code || e.message)) || "error";
      for (const [k, v] of Object.entries(work)) if (!(k in CLOUD.pending)) CLOUD.pending[k] = v;
      clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudFlush, 20000);
    }
    renderSync();
  });
  return CLOUD.chain;
}
async function cloudGetState(slot){
  if (!CLOUD.ok) return null;
  try {
    const h = await withRetry(() => cdoc(`slot-${slot}`).get()); if (!h.exists) return null;
    const d = h.data(); let json = "";
    for (let i = 0; i < d.chunks; i++) { const c = await withRetry(() => cdoc(`slot-${slot}-c${i}`).get()); json += (c.exists && c.data().s) || ""; }
    if (json.length !== d.len) return null;
    CLOUD.sent[slot] = json; return json;
  } catch(_) { return null; }
}
async function cloudGetIndex(){ if (!CLOUD.ok) return null; try { const d = await withRetry(() => cdoc("index").get()); return d.exists ? JSON.parse(d.data().index || "{}") : null; } catch(_) { return null; } }
async function cloudDelSlot(slot){
  if (!CLOUD.ok) return;
  CLOUD.chain = CLOUD.chain.then(async () => { try { const h = await cdoc(`slot-${slot}`).get(); const n = h.exists ? h.data().chunks : 0;
    await cdoc(`slot-${slot}`).delete(); for (let i = 0; i < n; i++) await cdoc(`slot-${slot}-c${i}`).delete(); delete CLOUD.sent[slot]; } catch(_) {} });
  return CLOUD.chain;
}

  paint(); let st = null, prev = null;
  const pos = e => { const b = box.getBoundingClientRect(); return { x: cl((e.clientX - b.left) / b.width), y: cl((e.clientY - b.top) / b.height) }; };
  box.addEventListener("pointerdown", e => { st = pos(e); prev = { ...ROI.r }; try { box.setPointerCapture(e.pointerId); } catch(_) {} e.preventDefault(); });

async function cropBlob(blob, r){
  const src = await loadBitmap(blob), W = src.width, H = src.height, m = 0.015;
  const x = Math.max(0, r.x - m) * W, y = Math.max(0, r.y - m) * H, w = Math.min(1, r.x + r.w + m) * W - x, h = Math.min(1, r.y + r.h + m) * H - y;
  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w)); cv.height = Math.max(1, Math.round(h));
  cv.getContext("2d").drawImage(src, x, y, w, h, 0, 0, cv.width, cv.height);
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("recorte")), "image/jpeg", 0.95));
}
async function readCap(key, engine){
  const c = S.caps[key]; const d = capDef(key);

  const blob = c.roi ? await cropBlob(full, c.roi).catch(() => full) : full;
  const token = uid(); c.readToken = token;
  Object.assign(c, { reading:true, prog:0, progLabel: engine === "claude" ? "Leyendo con Claude…" : "Cargando OCR…", ocrError:"" });
  paintCap(key); live();
  const onProg = (label, p) => { if (c.readToken !== token) return; c.progLabel = label; c.prog = p; paintCap(key); };
  try {
    let res = null, used = engine;
    if (d.kind === "code" && engine !== "claude") {
      onProg("Buscando código de barras…", 0.02);
      res = await readBarcode(blob).catch(() => null);
      if (res) used = "barcode";
    }
    if (!res) res = engine === "claude" ? await readWithClaude(blob, d) : await readLocal(blob, d.kind, onProg);
    if (c.readToken !== token) return;
    c.engine = used; c.barFormat = res.format || ""; c.ocrRaw = (res.raw || "").trim(); c.ocrConf = res.confidence ?? null;
    c.ocrCand = res.value || ""; c.value = c.ocrCand; c.validated = false;
  } catch (err) {
    if (c.readToken !== token) return;
    c.engine = engine;
    c.ocrError = (engine === "claude" ? "Claude no ha podido leer la foto" : "El OCR local no ha podido leer la foto") + ` (${err && err.message ? err.message : "error"}). ` +
      (engine === "local" && CLAUDE.vision ? "Prueba «Leer con Claude» o escribe el valor a mano." : "Escribe el valor a mano.");
  }
  c.reading = false; save(); paintCap(key); live();
  const inp = document.querySelector(`#${capId(key)} [data-capval]`); if (inp && !c.value) inp.focus();
}

/* ================= Códigos de barras y QR (BarcodeDetector nativo o ZXing) ================= */
function rotate90(cv){ const r = document.createElement("canvas"); r.width = cv.height; r.height = cv.width; const x = r.getContext("2d"); x.translate(r.width, 0); x.rotate(Math.PI/2); x.drawImage(cv, 0, 0); return r; }
function scaleCanvas(cv, maxSide){ const k = Math.min(1, maxSide / Math.max(cv.width, cv.height)); if (k === 1) return cv; const r = document.createElement("canvas"); r.width = Math.round(cv.width*k); r.height = Math.round(cv.height*k); r.getContext("2d").drawImage(cv, 0, 0, r.width, r.height); return r; }
const cleanBar = v => String(v || "").replace(/[\u0000-\u001f]/g, "").trim().toUpperCase();
async function readBarcode(blob){
  const cv = await prepImage(blob, "photo", 1800);
  if ("BarcodeDetector" in window) {
    try {
      const r = await new window.BarcodeDetector().detect(cv);
      if (r && r.length) { r.sort((a,b) => b.rawValue.length - a.rawValue.length);
        return { value: cleanBar(r[0].rawValue), raw: r.map(x => `${x.format}: ${x.rawValue}`).join("\n"), confidence:100, format: String(r[0].format).toUpperCase() }; }
    } catch(_) {}
  }
  if (typeof ZXing === "undefined") return null;
  const F = ZXing.BarcodeFormat, hints = new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.CODABAR, F.QR_CODE, F.DATA_MATRIX]);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const base = scaleCanvas(cv, 1400);
  for (const v of [base, scaleCanvas(cv, 900), rotate90(base)]) {
    try {
      const r = reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(v))));
      const fmt = F[r.getBarcodeFormat()] || "";
      return { value: cleanBar(r.getText()), raw: `${fmt}: ${r.getText()}`, confidence:100, format: fmt };
    } catch(_) {}
    await new Promise(res => setTimeout(res, 0));
  }
  return null;
}

/* ================= OCR local (Tesseract.js) con vigilancia de tiempo ================= */
const TESS = { p:null, w:null, broken:"" };
let tessProg = null;
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
function loadScript(src){ return new Promise((res, rej) => { const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("no se pudo cargar el modelo")); document.head.appendChild(s); }); }

const WASM_EMPTY = new Uint8Array([0,97,115,109,1,0,0,0]);
const WASM_SIMD = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]);
// Comprobaciones previas: dicen exactamente qué pieza falla en lugar de esperar a un tiempo de espera.
const DIAG = { steps:[] };
function diagStep(name, ok, detail){ DIAG.steps.push({ name, ok, detail: detail || "" }); }
async function preflight(){
  DIAG.steps = [];

  diagStep("Librería Tesseract.js", true);
  if (typeof WebAssembly === "undefined") { diagStep("WebAssembly", false, "no disponible"); throw new Error("el navegador no admite WebAssembly"); }
  try { await WebAssembly.compile(WASM_EMPTY); diagStep("WebAssembly en la página", true); }
  catch (e) { diagStep("WebAssembly en la página", false, e.message); throw new Error("este visor bloquea WebAssembly"); }
  const workerOk = await new Promise(res => {
    let w, done = false; const fin = (ok, d) => { if (done) return; done = true; try { w && w.terminate(); } catch(_){} res({ ok, d }); };
    try {
      const src = "onmessage=async()=>{try{await WebAssembly.compile(new Uint8Array([0,97,115,109,1,0,0,0]));postMessage('ok')}catch(e){postMessage('wasm: '+e.message)}}";
      w = new Worker(URL.createObjectURL(new Blob([src], { type:"application/javascript" })));
      w.onmessage = e => fin(e.data === "ok", e.data === "ok" ? "" : e.data);
      w.onerror = e => { e.preventDefault && e.preventDefault(); fin(false, e.message || "error al arrancar"); };
      w.postMessage(1); setTimeout(() => fin(false, "sin respuesta en 8 s"), 8000);
    } catch (e) { fin(false, e.message); }

async function workerURL(){
  const file = WebAssembly.validate(WASM_SIMD) ? "ocr-worker-simd.js" : "ocr-worker.js";
  try {
    const r = await withTimeout(fetch(file), 40000, "descarga lenta");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const u = URL.createObjectURL(new Blob([await r.text()], { type:"application/javascript" }));
    diagStep("Motor OCR descargado", true, file); return u;

function getTess(){

      tessProg && tessProg("Comprobando el motor OCR…", 0.03);
      await preflight();
      tessProg && tessProg("Cargando OCR (motor)…", 0.06);
      const wp = await workerURL();
      tessProg && tessProg("Cargando OCR (modelo de idioma)…", 0.12);
      if (!window.OCR_ENG_B64) await withTimeout(loadScript("ocr-eng.js"), 40000, "el modelo de idioma tarda demasiado en cargar");
      const data = b64ToBytes(window.OCR_ENG_B64);
      tessProg && tessProg("Arrancando el motor OCR…", 0.2);

        w = await withTimeout(Tesseract.createWorker([{ code:"eng", data }], 1, {

        }), 30000, "el motor OCR no arranca");
      } catch (e) { diagStep("Arranque de Tesseract", false, e.message); throw e; }
      diagStep("Arranque de Tesseract", true);

let tessQueue = Promise.resolve();
function readLocal(blob, kind, onProg){
  const job = tessQueue.then(async () => {
    tessProg = onProg;
    const canvas = await prepImage(blob, kind, 1200);
    const w = await getTess();
    await w.setParameters({ tessedit_char_whitelist: kind === "number" ? NUM_WL : CODE_WL, tessedit_pageseg_mode: "6" });
    onProg("Reconociendo texto…", 0.4);
    let r;
    try { r = await withTimeout(w.recognize(canvas), 30000, "la lectura ha superado 30 s"); }
    catch (e) { try { await w.terminate(); } catch(_){} TESS.p = null; TESS.w = null; throw e; }
    const raw = r.data.text || "";
    return { raw, confidence: r.data.confidence, value: kind === "number" ? pickNumber(raw) : pickCode(raw) };
  });

}
async function loadBitmap(blob){
  if ("createImageBitmap" in window) { try { return await createImageBitmap(blob, { imageOrientation:"from-image" }); } catch(_) {} }
  return await withTimeout(new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("imagen no legible")); i.src = URL.createObjectURL(blob); }), 15000, "la foto no se puede abrir");
}
// Escala, pasa a gris y estira el contraste; en displays oscuros invierte para texto oscuro sobre claro.
async function prepImage(blob, kind, maxSide){
  const src = await loadBitmap(blob);
  const k = Math.min(kind === "photo" ? 1 : 2.5, maxSide / Math.max(src.width, src.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(src.width*k); cv.height = Math.round(src.height*k);
  const ctx = cv.getContext("2d", { willReadFrequently:true }); ctx.drawImage(src, 0, 0, cv.width, cv.height);
  if (kind === "photo") return cv;
  const img = ctx.getImageData(0, 0, cv.width, cv.height), p = img.data, n = p.length/4;
  const g = new Uint8ClampedArray(n), hist = new Uint32Array(256); let mean = 0;
  for (let i=0,j=0;i<p.length;i+=4,j++){ const v = 0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; g[j]=v; hist[g[j]]++; mean += v; }
  mean /= n;
  let lo=0, hi=255, acc=0; for (let v=0;v<256;v++){ acc+=hist[v]; if (acc>n*0.02){ lo=v; break; } }
  acc=0; for (let v=255;v>=0;v--){ acc+=hist[v]; if (acc>n*0.02){ hi=v; break; } }
  const span = Math.max(1, hi-lo), inv = kind === "number" && mean < 110;
  for (let i=0,j=0;i<p.length;i+=4,j++){ let v=(g[j]-lo)*255/span; if (inv) v=255-v; p[i]=p[i+1]=p[i+2]=v; }

}
function pickCode(text){
  const toks = text.toUpperCase().split(/\s+/).map(t => t.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g, "")).filter(t => t.length >= 3);
  const sc = toks.map(t => ({ t, s: t.length + (/[A-Z]/.test(t) && /\d/.test(t) ? 10 : 0) + (/[-\/]/.test(t) ? 3 : 0) })).sort((a,b) => b.s-a.s);
  return sc.length ? sc[0].t : "";
}
function pickNumber(text){
  const m = text.replace(/(\d)[ \t]+(?=[.,\d])/g, "$1").replace(/([.,])[ \t]+(?=\d)/g, "$1").match(/-?\d+(?:[.,]\d+)?/g);
  if (!m) return "";
  m.sort((a,b) => b.replace(/\D/g,"").length - a.replace(/\D/g,"").length);
  return m[0].replace(".", ",");
}

/* ================= Lectura con Claude (visión) ================= */
const CLAUDE = { sample:null, vision:false, reason:"comprobando…" };
async function initClaude(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") { CLAUDE.reason = "este visor no ofrece funciones de Claude a la página"; return; }
    const s = await window.claude.use("sample"); if (!s) { CLAUDE.reason = "este visor no permite que la página consulte a Claude"; return; }
    const lim = await s.limits().catch(e => { CLAUDE.reason = "error al consultar límites: " + (e && (e.code || e.message)); return null; });
    CLAUDE.sample = s; CLAUDE.vision = !!(lim && lim.images);
    if (lim && !lim.images) CLAUDE.reason = "este visor no permite enviar imágenes a Claude";
    if (CLAUDE.vision) CLAUDE.reason = "";
    if (CLAUDE.vision) { document.querySelectorAll("[id^=cap-]").forEach(el => { const k = el.querySelector("[data-cap]")?.dataset.cap; if (k) paintCap(k); }); render(); }
  } catch(e) { CLAUDE.reason = "error: " + (e && e.message); }
}
async function readWithClaude(blob, d){
  if (!CLAUDE.vision) throw new Error("no disponible en este visor");
  const cv = await prepImage(blob, "photo", 1600);
  const jpg = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.92));
  const prompt = d.kind === "code"
    ? `La imagen es la etiqueta de un frasco o vial de laboratorio (${d.titulo.toLowerCase()}). Extrae el código identificativo alfanumérico principal tal como está escrito (código LIMS, código interno o lote). No inventes caracteres: si alguno es ilegible, pon "?" en su lugar. Responde SOLO con JSON: {"valor": "<código>", "otros_textos": "<resto del texto visible, resumido>", "confianza": <0-100>}`
    : `La imagen es la pantalla de un ${d.unidad === "pH" ? "pH-metro" : "balanza analítica (unidades en gramos)"} de laboratorio. Lee la cifra principal mostrada exactamente, con todos sus decimales; puede ser un display de 7 segmentos. No redondees ni inventes dígitos. Responde SOLO con JSON: {"valor": "<número con punto decimal>", "unidad_mostrada": "<unidad que se ve o vacío>", "otros_textos": "<otros textos visibles>", "confianza": <0-100>}`;
  const r = await withTimeout(CLAUDE.sample.json(prompt, { images: jpg, modelTier:"default" }), 60000, "sin respuesta en 60 s");
  let v = String(r && r.valor != null ? r.valor : "").trim();
  if (d.kind === "number") v = pickNumber(v); else v = v.toUpperCase().replace(/\s+/g, "");
  return { value: v, confidence: typeof r.confianza === "number" ? r.confianza : null, raw: [r.valor, r.unidad_mostrada, r.otros_textos].filter(Boolean).join("\n") };
}

/* ================= Equipos ================= */
const equipById = id => S.equips.find(e => e.id === id);
/* Un hueco de equipo puede ser "pipeta" o "pipeta~2" (segunda pipeta de la misma etapa). */
const eqBase = t => String(t).split("~")[0];
const eqDef = t => { const b = eqBase(t), n = String(t).split("~")[1], E = EQUIPOS[b] || EQUIPOS.otro; return n ? { ...E, nombre: `${E.nombre} (${n}.ª)` } : E; };
function eqResolve(stageKey){
  const [k, a, b, c] = stageKey.split(":");
  if (k === "curva") return { obj:S.curva, kindKey:"curva", etapa:"CURVA" };
  if (k === "analisis") return { obj:S.analisis, kindKey:"analisis:" + S.analisis.tecnica, etapa:"INYECCION" };
  const it = itemById(a);
  if (k === "prep") return { obj:prepById(it, b), it, kindKey:"prep:" + it.tanda, etapa:"PREPARACION" };
  if (k === "dil") return { obj:dilById(prepById(it, b), c), it, kindKey:"dil", etapa:"DILUCION" };
  if (k === "ph") return { obj:phById(it, b), it, kindKey:"ph", etapa:"LECTURA_PH" };
}
function eqSuggested(stageKey){
  const et = PCFG().etapas, k = stageKey.split(":")[0];
  if (k === "curva") return ["pipeta","vortex","ultrasonidos"];
  if (k === "prep") return et.prep[eqResolve(stageKey).it.tanda] || [];
  if (k === "dil") return et.dil || ["pipeta"];
  if (k === "ph") return et.ph || ["phmetro"];
  return et.analisis && S.analisis && S.analisis.tecnica ? [TECNICAS[S.analisis.tecnica].equipo, ...(TECNICAS[S.analisis.tecnica].columna ? ["columna"] : []), "ultrasonidos"] : [];
}
function eqRequired(stageKey){
  const k = stageKey.split(":")[0];

/* ---- Muestra fortificada ---- */
function fortCfg(it, p){ const sc = subCfg(it); if (!sc || !sc.fort) return null; return sc.fort[(p.fort && p.fort.nivel) || 0] || sc.fort[0]; }
function fortInit(it, p){
  if (!p.fort) p.fort = { nivel:0, rows:{}, devNota:"", doneAt:"" };
  const fc = fortCfg(it, p);
  for (const an of analitos()) if (!p.fort.rows[an]) p.fort.rows[an] = { src:"", just:"", conf:false, uL: fc ? fc.uL : "" };
  return p.fort;
}
function fortRow(it, p, an){
  const r = p.fort.rows[an], sol = solById(r.src), uL = uLOf(r.uL, r.uLU), m = massG(p);
  const ug = sol && sol.C != null && uL > 0 ? sol.C * uL : null;
  const nivel = ug != null && m > 0 && p.modo === "masa" ? ug / m : null;
  const fc = fortCfg(it, p), obj = fc && fc.objetivo;
  const offObj = nivel != null && obj ? Math.abs(nivel - obj) / obj * 100 > (PCFG().controles.tolFort || 10) : false;
  const offVol = !S.session.cfg.revision && fc && uL > 0 && num(fc.uL) !== uL;
  return { ug, nivel, obj, offObj, offVol, fc };
}
function fortError(it, p){
  fortInit(it, p);
  if (!analitos().length) return "No hay analitos con patrón de verificación.";
  let needDev = false;
  for (const an of analitos()) { const r = p.fort.rows[an];
    if (r.skip) { if ((r.skipWhy || "").trim().length < 5) return `${an}: explica por qué no se fortifica.`; continue; }
    const e = srcError(`fort|${it.id}|${p.id}|${an}`); if (e) return e;
    if (!(uLOf(p.fort.rows[an].uL, p.fort.rows[an].uLU) > 0)) return `${an}: indica el volumen que añades.`;
    const f = fortRow(it, p, an); if (f.offVol) needDev = true; }
  if (needDev && (p.fort.devNota || "").trim().length < 5) return "Justifica el volumen distinto del del PNT.";
  return "";
}
function viewFort(it, p, head){
  fortInit(it, p);
  const fc = fortCfg(it, p), m = massG(p);
  const rows = analitos().map(an => { const f = fortRow(it, p, an), r = p.fort.rows[an];
    if (r.skip) return `<div class="card"><div class="card-head"><h2>${esc(an)}</h2><span class="chip review">No se fortifica</span></div>
      <label class="f">¿Por qué no se fortifica ${esc(an)}?</label><textarea style="min-height:70px" data-fortskip="${esc(an)}" placeholder="Ej.: patrón de verificación agotado; pedido el día…">${esc(r.skipWhy || "")}</textarea>
      <button type="button" class="b-sec w100" data-act="fort-skip" data-an="${esc(an)}" data-v="0">Sí se fortifica: elegir disolución</button></div>`;
    return `<div class="card"><div class="card-head"><h2>${esc(an)}</h2><span class="chip ${srcError(`fort|${it.id}|${p.id}|${an}`) ? "review" : "ok"}">${srcError(`fort|${it.id}|${p.id}|${an}`) ? "Pendiente" : "Listo"}</span></div>
      ${srcHTML(`fort|${it.id}|${p.id}|${an}`)}
      <div class="linkbtns"><button type="button" data-act="fort-skip" data-an="${esc(an)}" data-v="1">No hay patrón / no se fortifica este analito</button><button type="button" data-act="new-patron">Preparar un patrón nuevo</button></div>
      <div class="field"><label class="f">¿Cuánto añades?</label><div class="unit"><input type="text" inputmode="decimal" class="mono big" data-fortul="${esc(an)}" value="${esc(p.fort.rows[an].uL)}">${unitSel(["µL","mL"], p.fort.rows[an].uLU || "µL", `data-act="fort-unit" data-an="${esc(an)}"`)}</div>${f.fc ? `<span class="hint">PNT: ${esc(f.fc.uL)} µL para ${esc(subLbl(it.submatriz))}</span>` : ""}</div>
      <div class="calc ${f.ug == null ? "empty" : ""}"><span class="k">Añadido a la muestra</span><span class="v">${f.ug == null ? "Completa los datos" : `${fnum(f.ug)} µg${f.nivel != null ? ` → ${fnum(f.nivel)} mg/kg` : ""}`}</span>
        ${f.obj ? `<span class="f">Objetivo del PNT: ${fnum(f.obj)} mg/kg${f.nivel != null ? ` · ${f.offObj ? "✗ fuera de ±" + (PCFG().controles.tolFort || 10) + " %" : "✓ dentro de tolerancia"}` : ""}</span>` : ""}</div>
      ${f.offObj ? `<div class="notice warn">Solo aviso: el nivel no coincide con el objetivo. ¿Has cogido una disolución más concentrada o más diluida de la que toca?</div>` : ""}
    </div>`; }).join("");
  const anyDev = analitos().some(an => fortRow(it, p, an).offVol);
  return head(`Preparación ${p.n} · Fortificación`, "Fortificación de la muestra", `Muestra de ${esc(subLbl(it.submatriz))}${m > 0 ? ` · ${fnum(m)} g pesados` : ""}. Se fortifica con el patrón de verificación de cada analito.`) +
    `<div class="stack">${!analitos().length ? `<div class="notice warn">No hay analitos con patrones registrados.</div>` : rows}
      ${anyDev ? `<div class="field"><label class="f" for="fdev">Justifica las diferencias con el PNT</label><textarea id="fdev" data-bind="prep.fort.devNota" style="min-height:80px">${esc(p.fort.devNota)}</textarea></div>` : ""}</div>`;
}

function buildLista(){

  if (S.analisis && S.analisis.blanco !== false) row("Blanco", "BLANCO", "", "");
  const cfg = PCFG().calib, curva = cfg && S.curva && !S.na.patron;
  if (curva) S.curva.niveles.forEach(L => row("Calibración", L.n, `${analitos().length} analitos`, ""));
  else for (const it of liveItems("patron")) for (const p of validPreps(it).filter(p => p.finishedAt)) { const ch = chain(it, p), nd = p.dils.filter(d => d.estado==="valida" && d.finishedAt).length;
    row("Patrón", it.code, `P${p.n}${nd ? ` · D${nd}` : ""}`, ch.final.C != null ? fconc(ch.final.C, ch.final.unit) : ""); }
  const qcs = curva ? S.curva.qcs : []; let qi = 0, sinceQC = 0;
  const addQC = () => { if (!qcs.length) return; const L = qcs[qi % qcs.length]; qi++; row("QC", L.n, `≈ ${L.ref} · verificación`, ""); sinceQC = 0; };
  if (qcs.length) addQC();
  for (const it of liveItems("muestra")) for (const p of validPreps(it).filter(p => p.finishedAt)) {
    const ch = chain(it, p), nd = p.dils.filter(d => d.estado==="valida" && d.finishedAt).length;
    const tipo = p.control === "doble" ? "Muestra doble" : p.control === "fortificada" ? "Muestra fortificada" : it.tipoMuestra === "blanco" ? "Blanco de extracción" : "Muestra";
    row(tipo, it.code, `P${p.n}${nd ? ` · D${nd}` : ""}`, ch.final.C != null ? fconc(ch.final.C, ch.final.unit) : "");

}

  const it = { id:"it_"+uid(), tanda, seq, nombre:"", code:"", codeCap:"", estado:"activo", createdAt:isoLocal(), idDoneAt:"", preps:[], phs:[] };
  if (blanco) { it.tipoMuestra = "blanco"; it.code = `BLANCO-EXT-${S.items.filter(i => i.tipoMuestra === "blanco").length + 1}`; it.nombre = "Blanco de extracción"; }
  it.codeCap = `code:${it.id}`;
  S.items.push(it); ensureCap(it.codeCap);
  S.edit = { itemId:it.id, stage:"id", open:true, origin:"tanda", returnTo:tanda };
  S.screen = tanda;
  save(); render(); window.scrollTo(0,0);
}
function newPrep(it, tipo, refPrep, control){
  const n = it.preps.length + 1;
  const p = { id:"p_"+uid(), n, tipo, control:control||"", refPrep:refPrep||"", estado:"valida", motivo:"", anuladaAt:"", modo:"masa", masaCap:"", volTomado:"", pureza:"100", volFinal:"", concDecl:"", concDeclUnit:"", startedAt:isoLocal(), finishedAt:"", dils:[] };
  p.masaCap = `masa:${it.id}:${p.id}`; ensureCap(p.masaCap);
  it.preps.push(p); return p;
}

function newPh(it){ const x = { id:"ph_"+uid(), n: it.phs.length+1, cap:"", estado:"valida", motivo:"", anuladaAt:"", startedAt:isoLocal(), doneAt:"" }; x.cap = `ph:${it.id}:${x.id}`; ensureCap(x.cap); it.phs.push(x); return x; }
function afterDilutions(it){
  if (needsPh(it) && !it.phs.some(x => x.estado==="valida" && x.doneAt)) { let x = it.phs.find(x => x.estado==="valida" && !x.doneAt) || newPh(it); S.edit.stage = "phEq"; S.edit.phId = x.id; eqInit(stageKeyOf(S.edit)); }
  else S.edit.stage = "next";
}
function stashEdit(){ if (S.edit) { S.editStack = S.editStack || []; S.edit.open = false; S.editStack.push(S.edit); S.edit = null; } }
function endEdit(){ S.edit = (S.editStack && S.editStack.length) ? S.editStack.pop() : null; if (S.edit) { S.edit.open = true; return true; } return false; }
function startEditFromReg(it, patch){
  if (S.edit) stashEdit();
  S.edit = Object.assign({ itemId:it.id, open:true, origin:"registro", returnTo:S.screen }, patch);
  const sk = stageKeyOf(S.edit); if (sk) eqInit(sk);
  closeSheet(); S.screen = it.tanda; save(); render(); window.scrollTo(0,0);
}

/* ================= Enlace de campos ================= */
function bindTarget(path){
  const [root, field] = path.split(".");
  if (root === "draft") return [S.draft, field];
  if (root === "na") return [S.na, field];
  if (root === "notes" || root === "noDev") return [S, root];
  if (root === "analisis") return [S.analisis, field];
  if (root === "curva") return [S.curva, field];
  if (path === "prep.fort.devNota") return [prepById(itemById(S.edit.itemId), S.edit.prepId).fort, "devNota"];
  const it = S.edit && itemById(S.edit.itemId);
  if (root === "item") return [it, field];
  if (root === "prep") return [prepById(it, S.edit.prepId), field];
  if (root === "dil") return [dilById(prepById(it, S.edit.prepId), S.edit.dilId), field];
  return [null, null];
}
function bindSet(path, val){ const [o, f] = bindTarget(path); if (!o) return; o[f] = val; save(); }
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) fn(el, ev); });
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.capval) {
    const key = el.dataset.capval, c = S.caps[key];
    let v = el.value;
    if (capDef(key).kind === "code") { const p = el.selectionStart; v = v.toUpperCase(); el.value = v; try { el.setSelectionRange(p,p); } catch(_){} }
    c.value = v.trim(); if (c.validated) c.validated = false;
    save(); paintCap(key); live(); return;
  }
  if (el.dataset.eqnota) { const e = equipById(el.dataset.eqnota); e.verifNota = el.value; save(); live(); return; }
  if (el.dataset.pntq) { const q = el.value.trim().toLowerCase(); document.querySelectorAll("[data-pntitem]").forEach(x => x.hidden = !!q && !x.dataset.pntitem.includes(q));
    document.querySelectorAll("#pnt-list [data-fam]").forEach(h => { let n = h.nextElementSibling, any = false; while (n && !n.hasAttribute("data-fam")) { if (!n.hidden) any = true; n = n.nextElementSibling; } h.hidden = !any; }); return; }
  if (el.dataset.cfg) { if (S.draft.cfg && !S.session) { S.draft.cfg[el.dataset.cfg] = el.value; save(); live(); } return; }
  if (el.dataset.fortskip) { const p = prepById(itemById(S.edit.itemId), S.edit.prepId); p.fort.rows[el.dataset.fortskip].skipWhy = el.value; save(); live(); return; }
  if (el.dataset.patjust) { S.patJust = S.patJust || {}; S.patJust[el.dataset.patjust] = { motivo: el.value, at: isoLocal() }; save(); live(); return; }
  if (el.dataset.srcjust) { srcObj(el.dataset.srcjust).just = el.value; save(); live(); return; }
  if (el.dataset.fortul) { const it = itemById(S.edit.itemId), p = prepById(it, S.edit.prepId); p.fort.rows[el.dataset.fortul].uL = el.value.trim(); save(); live(); return; }
  if (el.dataset.pt) { const [list, i, f, an] = el.dataset.pt.split("|"); const L = S.curva[list][+i]; if (f === "vf") L.vf = el.value.trim(); else L.alic[an] = el.value.trim(); save(); live(); return; }
  if (el.dataset.ancheck) { const c = S.analisis.checks[el.dataset.ancheck]; if (c) { c.nota = el.value; save(); live(); } return; }
  if (el.dataset.lista) { const [id, f] = el.dataset.lista.split(":"); const r = S.analisis.lista.find(x => x.id === id); if (r) { r[f] = el.value.trim(); save(); live(); } return; }
  if (el.dataset.eqname) { if (S.eqScan) S.eqScan.nombre = el.value; save(); return; }
  if (el.dataset.bind && el.type !== "checkbox" && el.type !== "radio") {
    let v = el.value;
    if (el.dataset.bind === "draft.workCode") { const p = el.selectionStart; v = v.toUpperCase(); el.value = v; try { el.setSelectionRange(p,p); } catch(_){} }
    bindSet(el.dataset.bind, v);
    el.closest(".field")?.querySelectorAll(".chips button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v.trim())));
    live();
  }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.type === "file" && el.dataset.plant) { const f = el.files && el.files[0]; el.value = ""; if (f) importPlantilla(f); return; }
  if (el.type === "file" && el.dataset.restore) { const f = el.files && el.files[0]; el.value = ""; if (f) importBackup(f); return; }
  if (el.type === "file" && el.dataset.cap) { const f = el.files && el.files[0]; el.value = ""; if (f) onPhoto(el.dataset.cap, f); return; }
  if (el.dataset.src) { const o = srcObj(el.dataset.src); o.src = el.value; o.conf = false; save(); render(); return; }
  if (el.dataset.srcconf) { srcObj(el.dataset.srcconf).conf = el.checked; save(); render(); return; }
  if (el.dataset.entok) { S.entregaOk = el.checked ? { at:isoLocal(), por:S.session.operator } : null; save(); render(); return; }
  if (el.dataset.qcref) { S.curva.qcs[+el.dataset.qcref].ref = el.value; save(); render(); return; }
  if (el.dataset.pthecho) { const [list, i] = el.dataset.pthecho.split("|"); S.curva[list][+i].hecho = el.checked ? isoLocal() : ""; save(); render(); return; }
  if (el.dataset.pt || el.dataset.fortul) { render(); return; }
  if (el.dataset.eqadd) { const t = el.value; if (!t) return; const eq = eqResolve(el.dataset.eqadd).obj.eq; if (!eq.tipos.includes(t)) eq.tipos.push(t); eq.confirmedAt = ""; save(); render(); return; }
  if (el.dataset.capok) { const k = el.dataset.capok; S.caps[k].validated = el.checked; save(); paintCap(k); live(); return; }
  if (el.dataset.bind === "item.submatriz") { render(); return; }
  if (el.dataset.bind && (el.type === "checkbox")) {
    bindSet(el.dataset.bind, el.checked);
    if (el.dataset.bind.startsWith("na.")) { S.naAt = S.naAt || {}; S.naAt[el.dataset.bind.slice(3)] = isoLocal(); save(); render(); return; }
    live(); return;
  }
  if (el.dataset.bind && (el.type === "radio" || el.tagName === "SELECT")) {
    bindSet(el.dataset.bind, el.value);
    if (el.dataset.bind === "draft.pnt") { S.draft.cfg = cfgFor(el.value); save(); const pc = $("#pnt-card"); if (pc) pc.innerHTML = pntCardHTML(); live(); return; }
    if (el.dataset.bind === "draft.formacion") { const F = FORMACION[el.value]; if (F && F.acomp) { S.draft.conjunto = "si"; S.draft.acompRol = F.rol; } save(); render(); return; }
    live(); }
});

/* ================= Cerrar un ensayo (libera su hueco) ================= */
async function closeTestNow(){
  const op = S.session ? S.session.operator : S.draft.operator, eng = S.engine, closed = SLOT;
  for (const c of Object.values(S.caps)) if (c.photoId) { await photoDel(c.photoId); MEM.delete(c.photoId); const u = URLS.get(c.photoId); if (u) { URL.revokeObjectURL(u); URLS.delete(c.photoId); } }
  await kvDel("state:" + SLOT); await cloudDelSlot(SLOT); delete INDEX[SLOT]; closeSheet();
  const other = openSlots()[0];
  if (other) { await kvPut("index", JSON.stringify(INDEX)); await loadSlot(other); render(); window.scrollTo(0,0); showSwitchOverlay(); toast(`Ensayo ${closed} cerrado.`); return; }
  SLOT = "A"; lsSet("agq-slot","A"); document.documentElement.dataset.slot = "A";
  S = newState(); S.draft.operator = op; S.engine = eng; await flushSave(); render(); window.scrollTo(0,0); toast(`Ensayo ${closed} cerrado.`);
}
function askCloseTest(){
  const ses = S.session;
  if (!ses) { if (openSlots().length > 1 || INDEX[SLOT]) return openSheet({ title:`Cerrar el hueco ${SLOT}`, body:`<p class="lead" style="margin:0">Este hueco no tiene ningún ensayo empezado. ¿Lo cierras?</p>`, cancelLabel:"No",
      confirm:{ label:"Sí, cerrar", run: () => closeTestNow() } }); return; }
  const id = `<div class="calc"><span class="k">Ensayo ${SLOT}</span><span class="v mono">${esc(ses.pnt)} · OT ${esc(ses.workCode)}</span><span class="f">${esc(ses.testId)} · ${esc(ses.operator)}</span></div>`;
  const reg = via => cerradoAdd({ testId:ses.testId, pnt:ses.pnt, ot:ses.workCode, analista:ses.operator, finalizado:S.finishedAt || "", cerrado:isoLocal(), via,
    carpeta: (S.entregas || []).slice(-1)[0] || null, sharepoint: S.entregaOk ? S.entregaOk.at : "", motivo: S.cerrado ? S.cerrado.motivo : "" });
  if (S.finalized && S.entregaOk) return openSheet({ title:`¿Seguro que cierras el ensayo ${SLOT}?`, danger:true, cancelLabel:"No, dejarlo abierto",
    body:`${id}<p class="lead" style="margin:0">Has confirmado que la carpeta está en SharePoint (${esc(human(S.entregaOk.at))}). Al cerrarlo se borra de este móvil con sus fotos.</p>`,
    confirm:{ label:"Sí, cerrar el ensayo", run: () => { reg("entregado"); closeTestNow(); } } });
  if (S.finalized) return openSheet({ title:"Aún no está confirmada la entrega", body:`${id}<div class="notice warn">Antes de cerrar, guarda la carpeta del ensayo y confirma que está en SharePoint (pasos 1 y 2 del resumen).</div>`, cancelLabel:"Entendido" });
  openSheet({ title:`¿Seguro que cierras el ensayo ${SLOT} sin terminar?`, danger:true, reason:true, cancelLabel:"No, dejarlo abierto",
    body:`${id}<div class="notice warn">El ensayo no está finalizado. Antes de borrarlo del móvil se descarga una <b>copia de seguridad</b> con todo lo registrado y sus fotos, por si hiciera falta recuperarlo. Si la descarga no se completa, no se borra nada.</div>`,
    confirm:{ label:"Sí, guardar copia y cerrar", run: async r => {
      S.cerrado = { at:isoLocal(), motivo:r, por: ses.operator }; save();
      const ok = await exportBackup(); if (!ok) { delete S.cerrado; save(); toast("No se ha guardado la copia: el ensayo sigue abierto."); return; }
      reg("sin terminar"); await closeTestNow(); } } });
}

/* ================= Plantilla del PNT =================
   La plantilla son los valores del PNT aprobado (analitos, recta, QC, naturalezas, pesos). Se escribe una vez,
   la primera vez que se hace el PNT, y el analista confirma que corresponde al PNT. Después sale rellenada y no
   cambia: si un día se usa otro valor, se justifica en el ensayo. Solo se actualiza cuando el PNT se revisa,
   indicando la nueva edición y el motivo. Queda registrado quién la creó o actualizó y cuándo. */
const PLANT_FIELDS = ["codigo","curva","inyeccion","doble","fortificada","blanco","ph","analitos","niveles","qcs","alicU","qcCada","tolQC","tolFort","naturalezas","tecnica","metodo","edicion"];
const canon = v => Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : (v && typeof v === "object") ? "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}" : JSON.stringify(v ?? null);

/* ================= Plantilla del PNT ================= */
function sharePlantilla(codigo){
  const pl = plantGet(codigo); if (!pl) { toast("Aún no hay plantilla de este PNT."); return; }
  saveFile(`PLANTILLA_${safe(pl.codigo)}.json`, new Blob([JSON.stringify({ tipo:"ariadna-plantilla", v:1, exportada:isoLocal(), cfg:pl }, null, 1)], { type:"application/json" }));
}
async function importPlantilla(file){
  try {
    const j = JSON.parse(await file.text());
    const c = j && j.tipo === "ariadna-plantilla" ? j.cfg : null;
    if (!c || !c.codigo) throw new Error("no es una plantilla de Ariadna");
    const cfg = Object.assign(cfgBase(normCode(c.codigo), c.titulo), c, { codigo: normCode(c.codigo) }); delete cfg.firma; delete cfg.estadoPlantilla; delete cfg.revision;
    const prev = plantGet(cfg.codigo);
    const apply = () => { plantSet(cfg); if (!S.session) { S.draft.pnt = cfg.codigo; S.draft.cfg = cfgFor(cfg.codigo); } closeSheet(); save(); render(); toast(`Plantilla de ${cfg.codigo} cargada.`); };
    if (prev && !samePlant(prev, cfg)) return openSheet({ title:`Ya tienes una plantilla de ${esc(cfg.codigo)}`, body:`<p class="lead" style="margin:0">La de este móvil: ${esc(plantTxt(prev))}.<br>La del archivo: ${esc(plantTxt(Object.assign({ estadoPlantilla:"guardada" }, cfg)))}.</p><span class="hint">Sustitúyela solo si la del archivo es la del PNT en vigor.</span>`,
      cancelLabel:"No, dejar la mía", confirm:{ label:"Sustituir", run: apply } });
    apply();
  } catch(e) { toast("No se pudo cargar: " + (e.message || e)); }
}
/* Lo registrado hoy, en forma de plantilla. Los analitos se acumulan: no se pierden los que hoy no se han analizado. */
function plantillaDeHoy(){
  const ses = S.session, prev = plantGet(ses.pnt), c = JSON.parse(JSON.stringify(ses.cfg));
  c.analitos = [...new Set([...(prev ? prev.analitos : []), ...analitos()])];
  if (c.curva && S.curva && !S.na.patron) {
    const lv = (L, kind) => { const an = analitos(), al = {}; an.forEach(a => al[a] = L.alic[a]); const vals = [...new Set(Object.values(al))];
      return Object.assign({ n:L.n, vf:L.vf, alic: vals.length === 1 ? vals[0] : (vals[0] || "") , alicAn: al }, kind === "qc" ? { ref:L.ref } : {}); };
    c.niveles = S.curva.niveles.map(L => lv(L, "cal")); c.qcs = S.curva.qcs.map(L => lv(L, "qc")); c.alicU = S.curva.alicU || "mL";
  }
  for (const it of liveItems("muestra")) for (const p of validPreps(it).filter(p => p.control === "fortificada" && p.fort && p.fort.doneAt)) {
    const n = c.naturalezas.find(x => x.n === it.submatriz); const r = Object.values(p.fort.rows).find(r => !r.skip && r.uL);
    if (n && r) n.uL = String(uLOf(r.uL, r.uLU));
  }
  if (S.analisis && S.analisis.tecnica) { c.tecnica = S.analisis.tecnica; c.metodo = S.analisis.metodoEquipo || c.metodo; c.edicion = S.analisis.edicionPnt || c.edicion; }
  return c;
}
const plantSig = c => JSON.stringify(Object.assign({}, c, { actualizada:"" }));
/* Al finalizar: la primera vez (o con el PNT revisado) se confirma que los valores de hoy son los del PNT y se guardan.
   Con plantilla ya guardada no se cambia nada: lo distinto de hoy queda justificado en el ensayo. */
function guardarPlantilla(){
  try {
    const ses = S.session, cf = ses.cfg;
    if (cf.estadoPlantilla === "guardada" && !cf.revision) return;
    const c = plantillaDeHoy(); delete c.estadoPlantilla; delete c.revision;
    const quien = ses.operator, at = isoLocal();
    setTimeout(() => openSheet({ title:`Valores del PNT ${esc(c.codigo)}`, body:`<p class="lead" style="margin:0">${cf.revision ? `PNT revisado (${esc(cf.revision.edicion)}).` : "Es la primera vez con este PNT."} Estos son los valores que has usado hoy: <b>${esc(cfgSummary(c) || "—")}</b>.</p>
        <span class="hint">Si corresponden al PNT aprobado, se guardan y la próxima vez salen rellenados.</span>`,
      cancelLabel:"No, no guardarlos", confirm:{ label:"Sí, son los del PNT", run: () => {
        Object.assign(c, cf.revision ? { actualizada:at, actualizadaPor:quien, revisiones:[...(c.revisiones || []), cf.revision] } : { actualizada:at, creadaPor:quien, creadaEnsayo:ses.testId });
        plantSet(c); S.plantillaGuardada = { at, por:quien }; save(); closeSheet(); render(); toast(`Valores de ${c.codigo} guardados.`); } } }), 700);
  } catch(_) {}
}

  if (STATE_FOUND && S.session && !S.finalized) toast(`Ensayo ${S.session.testId} recuperado.`);
  renderSync(); setTimeout(uploadPending, 3000);
  if (S.session) flushSave();
  initClaude();
  if (S.session && !S.finalized && S.engine === "local") setTimeout(() => getTess().catch(()=>{}), 1500);
})();
})();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
